name: CI

on:
  # Run the checks (typecheck/lint/test/build/docker build/scan) on a push
  # to ANY branch, so feedback happens as soon as you push, not only once
  # you open a PR.
  push:
    branches: ['**']
  # Also run on PRs targeting main - this is what makes the checks show up
  # as required status checks on the PR itself (see branch protection
  # setup below), and covers PRs opened from a fork, which produce a
  # pull_request event but no push event against this repository.
  pull_request:
    branches: [main]
  # Lets you manually re-run the whole pipeline (including deploy, if run
  # against main) from the Actions tab - handy right after wiring up the
  # exe.dev secrets/variables, without needing an empty commit to test.
  workflow_dispatch:

jobs:
  build-and-test:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: order_user
          POSTGRES_PASSWORD: order_pass
          POSTGRES_DB: order_system
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U order_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://order_user:order_pass@localhost:5433/order_system
      PAYMENT_FAILURE_MODE: 'false'
      LOG_LEVEL: silent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit + integration tests (API, DB, Activities, Workflow)
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Dependency audit (fails only on high/critical)
        run: npm audit --audit-level=high
        continue-on-error: true

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: durable-order-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: durable-order-system:ci

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: durable-order-system:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

  deploy:
    name: Deploy to exe.dev
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    # Only deploy on a real merge to main (push), or a manual re-run
    # targeted at main (workflow_dispatch, for testing) - never on a pull
    # request, since a PR from a fork would otherwise be able to trigger a
    # deploy using this repo's secrets.
    #
    # Deliberately NOT also gating on "is EXE_DEV_HOST configured" here:
    # that value lives as an EXE_DEV_HOST environment variable scoped to
    # the exe-dev Environment (see the `environment:` key below), and a
    # job's `if:` is evaluated before the job is granted entry into its
    # Environment - so environment-scoped vars/secrets are never visible
    # in this condition, only repository/org-level ones are. Since exe.dev
    # is always configured for this repo, that extra check would only add
    # confusion (a silent skip instead of a clear failure) for no benefit.
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    environment: exe-dev
    steps:
      - name: SSH into exe.dev VM and run the deploy script
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.EXE_DEV_HOST }}
          username: ${{ vars.EXE_DEV_USER }}
          key: ${{ secrets.EXE_DEV_SSH_KEY }}
          port: ${{ vars.EXE_DEV_PORT || '22' }}
          script_stop: true
          script: |
            cd ${{ vars.EXE_DEV_DEPLOY_PATH }}
            ./scripts/deploy.sh
